<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>Split the bill</title>
  <link rel="stylesheet" href="styles-bill.css?v=1">
</head>
<body>
  <div class="app">
    <h1>Split the bill</h1>
    <p class="sub">Tap letters to assign items.</p>

    <div class="section">
      <div class="section-title">Split</div>

      <div class="people-row" id="peopleRow"></div>

      <div class="people-row" style="margin-top:8px;">
        <div class="add-person" id="addPersonBtn">+</div>
      </div>

      <div class="summary-top">
        <strong>Total</strong>
        <div class="total-amount" id="grandTotal">£0.00</div>
      </div>

      <div class="tip-row">
        <div>Tip %</div>
        <input class="tip-input" id="tipInput" type="number" value="12.5">
      </div>

      <div class="sub-line" id="subLine">
        Subtotal £0.00 · Tip £0.00
      </div>
    </div>

    <div class="section">
      <div class="section-title">Items</div>
      <div class="items-table" id="itemsContainer"></div>
      <button class="add-item" id="addItemBtn" type="button">+ Add item</button>
    </div>
  </div>

  <script>
    let people = ["A","B","C"];
    let items = [
      {name:"Burger",price:12,assigned:["A"]},
      {name:"Chips",price:6,assigned:["A","B"]},
      {name:"Wine",price:18,assigned:["B","C"]}
    ];
    let tip = 12.5;

    function money(n){return "£"+(Number(n)||0).toFixed(2)}

    function nextLetter(){
      return String.fromCharCode(65 + people.length);
    }

    function totals(){
      let subtotal = 0;
      let map = {};
      people.forEach(p=>map[p]=0);

      items.forEach(i=>{
        let price = Number(i.price)||0;
        subtotal += price;
        if(!i.assigned.length) return;

        let share = price / i.assigned.length;
        i.assigned.forEach(p=>map[p]+=share);
      });

      let tipAmount = subtotal * (tip/100);
      let final = {};

      people.forEach(p=>{
        let ratio = subtotal ? map[p]/subtotal : 0;
        final[p] = map[p] + ratio*tipAmount;
      });

      return { subtotal, tipAmount, grand: subtotal + tipAmount, final };
    }

    function renderPeople(){
      let row = document.getElementById("peopleRow");
      row.innerHTML = "";
      let t = totals();

      people.forEach(p=>{
        let el = document.createElement("div");
        el.className = "person-pill";
        el.innerHTML = `<div>${p}</div><div><b>${money(t.final[p])}</b></div>`;
        row.appendChild(el);
      });
    }

    function renderItems(){
      let c = document.getElementById("itemsContainer");
      c.innerHTML = "";

      items.forEach((item,i)=>{
        let row = document.createElement("div");
        row.className = "item-row";

        let name = document.createElement("input");
        name.className = "item-name";
        name.value = item.name;
        name.oninput = e => { item.name = e.target.value; render(); };

        let price = document.createElement("input");
        price.className = "item-price";
        price.type = "number";
        price.value = item.price;
        price.oninput = e => { item.price = Number(e.target.value); render(); };

        let chips = document.createElement("div");
        chips.className = "chips-inline";

        people.forEach(p=>{
          let chip = document.createElement("div");
          chip.className = "chip" + (item.assigned.includes(p) ? " selected" : "");
          chip.textContent = p;
          chip.onclick = ()=>{
            item.assigned = item.assigned.includes(p)
              ? item.assigned.filter(x=>x!==p)
              : [...item.assigned,p];
            render();
          };
          chips.appendChild(chip);
        });

        let del = document.createElement("button");
        del.className = "delete-item";
        del.textContent = "×";
        del.onclick = ()=>{ items.splice(i,1); render(); };

        row.append(name, price, chips, del);
        c.appendChild(row);
      });
    }

    function renderSummary(){
      let t = totals();
      document.getElementById("grandTotal").textContent = money(t.grand);
      document.getElementById("subLine").textContent =
        `Subtotal ${money(t.subtotal)} · Tip ${money(t.tipAmount)}`;
    }

    function render(){
      renderPeople();
      renderItems();
      renderSummary();
      document.getElementById("tipInput").value = tip;
    }

    document.getElementById("addPersonBtn").onclick = ()=>{
      people.push(nextLetter());
      render();
    };

    document.getElementById("addItemBtn").onclick = ()=>{
      items.push({name:"New item",price:0,assigned:[]});
      render();
    };

    document.getElementById("tipInput").oninput = e=>{
      tip = Number(e.target.value);
      render();
    };

    render();
  </script>
</body>
</html>
