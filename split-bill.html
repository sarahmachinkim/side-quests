<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>Split the bill</title>
  <link rel="stylesheet" href="styles-bill.css?v=9">
</head>
<body>
  <div class="app">
    <div class="page-title">Split the bill</div>
    <div class="page-subtitle">Tap letters to assign items.</div>

    <div class="top-panel">
      <div class="people-summary-wrap">
        <div class="people-summary" id="peopleRow"></div>
      </div>

      <div class="total-line" id="grandTotalLine">Total = £0.00</div>

      <button class="add-people-button" id="addPersonBtn" type="button">
        + Add People
      </button>
    </div>

    <div class="section">
      <div class="section-title">Items</div>
      <div class="items-table" id="itemsContainer"></div>
      <button class="add-item" id="addItemBtn" type="button">+ Add item</button>
    </div>
  </div>

 <script>
  let people = ["A", "B", "C"];
  let items = [
    { name: "Burger", price: 12, assigned: ["A"] },
    { name: "Chips", price: 6, assigned: ["A", "B"] },
    { name: "Wine", price: 18, assigned: ["B", "C"] }
  ];
  let tipPercent = 12.5;

  function money(n) {
    return "£" + (Number(n) || 0).toFixed(2);
  }

  function nextLetter() {
    return String.fromCharCode(65 + people.length);
  }

  function totals() {
    let subtotal = 0;
    let assignedSubtotal = 0;
    let map = {};
    people.forEach(p => map[p] = 0);

    items.forEach(i => {
      let price = Number(i.price) || 0;
      subtotal += price;

      if (!i.assigned.length) return;

      assignedSubtotal += price;

      let share = price / i.assigned.length;
      i.assigned.forEach(p => map[p] += share);
    });

    let tipAmount = subtotal * (tipPercent / 100);
    let evenTipShare = people.length ? tipAmount / people.length : 0;
    let final = {};

    people.forEach(p => {
      final[p] = map[p] + evenTipShare;
    });

    return {
      subtotal,
      assignedSubtotal,
      unassignedSubtotal: subtotal - assignedSubtotal,
      tipAmount,
      grand: subtotal + tipAmount,
      final
    };
  }

  function mapAmountForPerson(person) {
    let amount = 0;

    items.forEach(i => {
      const price = Number(i.price) || 0;
      if (!i.assigned.length) return;
      if (!i.assigned.includes(person)) return;
      amount += price / i.assigned.length;
    });

    return amount;
  }

 function renderPeople() {
  const row = document.getElementById("peopleRow");
  row.innerHTML = "";
  const t = totals();

  let widths = [];

  people.forEach(p => {
    const itemOnlyAmount = mapAmountForPerson(p);
    const fraction = t.subtotal ? itemOnlyAmount / t.subtotal : 0;
    widths.push(fraction * 100);
  });

  const MIN = 12;
  let adjusted = widths.map(w => (w > 0 ? Math.max(w, MIN) : 0));

  const totalAdjusted = adjusted.reduce((a, b) => a + b, 0);

  if (totalAdjusted > 0) {
    adjusted = adjusted.map(w => (w / totalAdjusted) * 100);
  }

  people.forEach((p, i) => {
    const displayAmount = t.final[p] || 0;

    const card = document.createElement("div");
    card.className = "person-summary-card";
    card.style.flex = adjusted[i] > 0 ? `0 0 ${adjusted[i]}%` : "0 0 0%";

    card.innerHTML = `
      <div class="person-bar"></div>
      <div class="person-code">${p}</div>
      <div class="person-value">${displayAmount.toFixed(2)}</div>
    `;

    row.appendChild(card);
  });
}

  function buildItemRow(item, i) {
    const row = document.createElement("div");
    row.className = "item-row";

    const top = document.createElement("div");
    top.className = "item-top";

    const name = document.createElement("input");
    name.className = "item-name";
    name.value = item.name;
    name.oninput = e => {
      item.name = e.target.value;
      render();
    };

    const price = document.createElement("input");
    price.className = "item-price";
    price.type = "number";
    price.value = item.price;
    price.oninput = e => {
      item.price = Number(e.target.value);
      render();
    };

    const del = document.createElement("button");
    del.className = "delete-item";
    del.textContent = "×";
    del.onclick = () => {
      items.splice(i, 1);
      render();
    };

    top.append(name, price, del);

    const chips = document.createElement("div");
    chips.className = "chips-inline";

    people.forEach(p => {
      const chip = document.createElement("div");
      chip.className = "chip" + (item.assigned.includes(p) ? " selected" : "");
      chip.textContent = p;
      chip.onclick = () => {
        item.assigned = item.assigned.includes(p)
          ? item.assigned.filter(x => x !== p)
          : [...item.assigned, p];
        render();
      };
      chips.appendChild(chip);
    });

    row.append(top, chips);
    return row;
  }

  function buildTipRow() {
    const row = document.createElement("div");
    row.className = "item-row tip-row-item";

    const top = document.createElement("div");
    top.className = "item-top";

    const tipName = document.createElement("div");
    tipName.className = "item-name tip-display";
    tipName.textContent = `${money(totals().tipAmount)} Tip`;

    const tipPct = document.createElement("input");
    tipPct.className = "item-price tip-percent-input";
    tipPct.type = "number";
    tipPct.value = tipPercent;
    tipPct.oninput = e => {
      tipPercent = Number(e.target.value);
      render();
    };

    const lock = document.createElement("div");
    lock.className = "delete-item tip-lock";
    lock.textContent = "—";

    top.append(tipName, tipPct, lock);

    const chips = document.createElement("div");
    chips.className = "chips-inline";

    people.forEach(p => {
      const chip = document.createElement("div");
      chip.className = "chip chip-muted selected";
      chip.textContent = p;
      chips.appendChild(chip);
    });

    row.append(top, chips);
    return row;
  }

  function renderItems() {
    const c = document.getElementById("itemsContainer");
    c.innerHTML = "";

    items.forEach((item, i) => {
      c.appendChild(buildItemRow(item, i));
    });

    c.appendChild(buildTipRow());
  }

  function renderSummary() {
    const t = totals();
    document.getElementById("grandTotalLine").textContent = `Total = ${money(t.grand)}`;
  }

  function render() {
    renderPeople();
    renderItems();
    renderSummary();
  }

  document.getElementById("addPersonBtn").onclick = () => {
    people.push(nextLetter());
    render();
  };

  document.getElementById("addItemBtn").onclick = () => {
    items.push({ name: "New item", price: 0, assigned: [] });
    render();
  };

  render();
</script>
</body>
</html>
