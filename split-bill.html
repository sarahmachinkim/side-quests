<body>
  <div class="app">
    <h1>Split the bill</h1>
    <p class="sub">Tap letters to assign items.</p>

    <!-- TOP: PEOPLE + SUMMARY -->
    <div class="section">
      <div class="section-title">Split</div>

      <div class="people-row" id="peopleRow"></div>

      <div class="people-row" style="margin-top:8px;">
        <div class="add-person" id="addPersonBtn">+</div>
      </div>

      <div style="margin-top:12px;">
        <div class="summary-top">
          <strong>Total</strong>
          <div class="total-amount" id="grandTotal">£0.00</div>
        </div>

        <div class="tip-row">
          <div class="tip-label">Tip %</div>
          <input class="tip-input" id="tipInput" type="number" step="0.1" value="12.5" />
        </div>

        <div class="sub-line" id="subLine">
          Subtotal £0.00 · Tip £0.00
        </div>
      </div>
    </div>

    <!-- ITEMS -->
    <div class="section">
      <div class="section-title">Items</div>
      <div class="items-table" id="itemsContainer"></div>
      <button class="add-item" id="addItemBtn" type="button">+ Add item</button>
    </div>
  </div>

  <script>
    let people = ["A", "B", "C"];
    let items = [
      { name: "Burger", price: 12, assigned: ["A"] },
      { name: "Chips", price: 6, assigned: ["A", "B"] },
      { name: "Wine", price: 18, assigned: ["B", "C"] }
    ];
    let tip = 12.5;

    function money(n) {
      return "£" + (Number(n) || 0).toFixed(2);
    }

    function nextLetter() {
      return String.fromCharCode(65 + people.length);
    }

    function calculateTotals() {
      const subtotals = {};
      const itemMap = {};
      people.forEach(p => {
        subtotals[p] = 0;
        itemMap[p] = [];
      });

      let subtotal = 0;

      items.forEach(item => {
        const price = Number(item.price) || 0;
        subtotal += price;

        if (!item.assigned.length) return;

        const share = price / item.assigned.length;

        item.assigned.forEach(person => {
          subtotals[person] += share;
          itemMap[person].push(item.name || "Item");
        });
      });

      const tipAmount = subtotal * (tip / 100);
      const final = {};

      people.forEach(p => {
        const ratio = subtotal > 0 ? subtotals[p] / subtotal : 0;
        final[p] = subtotals[p] + ratio * tipAmount;
      });

      return { subtotal, tipAmount, grandTotal: subtotal + tipAmount, final, itemMap };
    }

    function toggleAssignment(i, p) {
      const a = items[i].assigned;
      items[i].assigned = a.includes(p) ? a.filter(x => x !== p) : [...a, p];
      render();
    }

    function addPerson() {
      people.push(nextLetter());
      render();
    }

    function addItem() {
      items.push({ name: "New item", price: 0, assigned: [] });
      render();
    }

    function deleteItem(i) {
      items.splice(i, 1);
      render();
    }

    function renderPeople() {
      const row = document.getElementById("peopleRow");
      row.innerHTML = "";

      const totals = calculateTotals();

      people.forEach(p => {
        const card = document.createElement("div");
        card.className = "person-pill";

        const amount = totals.final[p] || 0;

        card.innerHTML = `
          <div style="text-align:center;">
            <div style="font-size:12px;">${p}</div>
            <div style="font-weight:700;">${money(amount)}</div>
          </div>
        `;

        row.appendChild(card);
      });
    }

    function renderItems() {
      const container = document.getElementById("itemsContainer");
      container.innerHTML = "";

      items.forEach((item, i) => {
        const row = document.createElement("div");
        row.className = "item-row";

        const name = document.createElement("input");
        name.className = "item-name";
        name.value = item.name;
        name.oninput = e => { items[i].name = e.target.value; render(); };

        const price = document.createElement("input");
        price.className = "item-price";
        price.type = "number";
        price.value = item.price;
        price.oninput = e => { items[i].price = Number(e.target.value); render(); };

        const chips = document.createElement("div");
        chips.className = "chips-inline";

        people.forEach(p => {
          const chip = document.createElement("div");
          chip.className = "chip" + (item.assigned.includes(p) ? " selected" : "");
          chip.textContent = p;
          chip.onclick = () => toggleAssignment(i, p);
          chips.appendChild(chip);
        });

        const del = document.createElement("button");
        del.className = "delete-item";
        del.textContent = "×";
        del.onclick = () => deleteItem(i);

        row.appendChild(name);
        row.appendChild(price);
        row.appendChild(chips);
        row.appendChild(del);

        container.appendChild(row);
      });
    }

    function renderSummary() {
      const t = calculateTotals();

      document.getElementById("grandTotal").textContent = money(t.grandTotal);
      document.getElementById("subLine").textContent =
        `Subtotal ${money(t.subtotal)} · Tip ${money(t.tipAmount)}`;
    }

    function render() {
      renderPeople();
      renderItems();
      renderSummary();
      document.getElementById("tipInput").value = tip;
    }

    document.getElementById("addPersonBtn").onclick = addPerson;
    document.getElementById("addItemBtn").onclick = addItem;
    document.getElementById("tipInput").oninput = e => {
      tip = Number(e.target.value);
      render();
    };

    render();
  </script>
</body>
