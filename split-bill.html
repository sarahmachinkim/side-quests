<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>Split the bill</title>
  <link rel="stylesheet" href="styles-bill.css?v=8">
</head>
<body>
  <div class="app">
    <h1>Split the bill</h1>
    <p class="sub">Tap letters to assign items</p>

    <div class="section">
      <div class="section-title">Split</div>

      <div class="split-top">
        <div class="people-row" id="peopleRow"></div>
        <div class="add-person" id="addPersonBtn">+</div>
      </div>

      <div class="summary-top">
        <strong>Total</strong>
        <div class="total-amount" id="grandTotal">£0.00</div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Items</div>
      <div class="items-table" id="itemsContainer"></div>
      <button class="add-item" id="addItemBtn" type="button">+ Add item</button>
    </div>
  </div>

  <script>
    let people = ["A","B","C"];
    let items = [
      {name:"Burger",price:12,assigned:["A"]},
      {name:"Chips",price:6,assigned:["A","B"]},
      {name:"Wine",price:18,assigned:["B","C"]}
    ];
    let tipPercent = 12.5;

    function money(n){
      return "£" + (Number(n) || 0).toFixed(2);
    }

    function nextLetter(){
      return String.fromCharCode(65 + people.length);
    }

    function totals(){
      let subtotal = 0;
      let map = {};
      people.forEach(p => map[p] = 0);

      items.forEach(i => {
        let price = Number(i.price) || 0;
        subtotal += price;
        if (!i.assigned.length) return;

        let share = price / i.assigned.length;
        i.assigned.forEach(p => map[p] += share);
      });

      let tipAmount = subtotal * (tipPercent / 100);
      let final = {};

      people.forEach(p => {
        let evenTipShare = people.length ? tipAmount / people.length : 0;
        final[p] = map[p] + evenTipShare;
      });

      return {
        subtotal,
        tipAmount,
        grand: subtotal + tipAmount,
        final
      };
    }

    function renderPeople(){
      const row = document.getElementById("peopleRow");
      row.innerHTML = "";
      const t = totals();

      people.forEach(p => {
        const amount = t.final[p] || 0;
        const fraction = t.grand ? amount / t.grand : 1 / people.length;
        const flexGrow = Math.max(1, fraction * 10);

        const el = document.createElement("div");
        el.className = "person-pill";
        el.style.flex = `${flexGrow} 1 0`;
        el.innerHTML = `
          <div class="person-label">${p}</div>
          <div class="person-amount">${money(amount)}</div>
        `;
        row.appendChild(el);
      });
    }

    function renderItems(){
      const c = document.getElementById("itemsContainer");
      c.innerHTML = "";

      items.forEach((item, i) => {
        const row = document.createElement("div");
        row.className = "item-row";

        const top = document.createElement("div");
        top.className = "item-top";

        const name = document.createElement("input");
        name.className = "item-name";
        name.value = item.name;
        name.oninput = e => {
          item.name = e.target.value;
          render();
        };

        const price = document.createElement("input");
        price.className = "item-price";
        price.type = "number";
        price.value = item.price;
        price.oninput = e => {
          item.price = Number(e.target.value);
          render();
        };

        const del = document.createElement("button");
        del.className = "delete-item";
        del.textContent = "×";
        del.onclick = () => {
          items.splice(i, 1);
          render();
        };

        top.append(name, price, del);

        const chips = document.createElement("div");
        chips.className = "chips-inline";

        people.forEach(p => {
          const chip = document.createElement("div");
          chip.className = "chip" + (item.assigned.includes(p) ? " selected" : "");
          chip.textContent = p;
          chip.onclick = () => {
            item.assigned = item.assigned.includes(p)
              ? item.assigned.filter(x => x !== p)
              : [...item.assigned, p];
            render();
          };
          chips.appendChild(chip);
        });

        row.append(top, chips);
        c.appendChild(row);
      });

      const tipRow = document.createElement("div");
      tipRow.className = "item-row tip-row-item";

      const tipTop = document.createElement("div");
      tipTop.className = "item-top";

      const tipName = document.createElement("div");
      tipName.className = "item-name tip-display";
      tipName.textContent = `${money(totals().tipAmount)} Tip`;

      const tipPct = document.createElement("input");
      tipPct.className = "item-price tip-percent-input";
      tipPct.type = "number";
      tipPct.value = tipPercent;
      tipPct.oninput = e => {
        tipPercent = Number(e.target.value);
        render();
      };

      const tipLock = document.createElement("div");
      tipLock.className = "delete-item tip-lock";
      tipLock.textContent = "—";

      tipTop.append(tipName, tipPct, tipLock);

      const tipChips = document.createElement("div");
      tipChips.className = "chips-inline";

      people.forEach(p => {
        const chip = document.createElement("div");
        chip.className = "chip chip-muted selected";
        chip.textContent = p;
        tipChips.appendChild(chip);
      });

      tipRow.append(tipTop, tipChips);
      c.appendChild(tipRow);
    }

    function renderSummary(){
      const t = totals();
      document.getElementById("grandTotal").textContent = money(t.grand);
    }

    function render(){
      renderPeople();
      renderItems();
      renderSummary();
    }

    document.getElementById("addPersonBtn").onclick = () => {
      people.push(nextLetter());
      render();
    };

    document.getElementById("addItemBtn").onclick = () => {
      items.push({name:"New item",price:0,assigned:[]});
      render();
    };

    render();
  </script>
</body>
</html>
